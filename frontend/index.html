<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>The Fix</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 18px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .username-display {
            font-size: 14px;
            color: #d1d5db;
        }

        .logout-button {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .auth-card,
        .chat-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .auth-card {
            max-width: 450px;
            margin: 60px auto;
            padding: 30px;
        }

        .auth-card h2 {
            margin-top: 0;
            text-align: center;
        }

        .auth-card p {
            text-align: center;
            color: #666;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            cursor: pointer;
            background: #e5e7eb;
        }

        .tab.active {
            background: #111827;
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .primary-button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .primary-button:hover {
            background: #1d4ed8;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
        }

        .message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .chat-card {
            padding: 20px;
        }

        #chat {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fafafa;
            margin-bottom: 15px;
        }

        .chat-message {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user-message {
            background: #dbeafe;
            margin-left: 15%;
        }

        .ai-message {
            background: #e5e7eb;
            margin-right: 15%;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        .send-button {
            padding: 12px 20px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 7px;
            cursor: pointer;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .upload-area {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed #aaa;
            border-radius: 8px;
        }

        .upload-area input {
            margin-right: 10px;
        }

        #uploadStatus {
            margin-top: 10px;
            font-size: 14px;
        }

        #documentList {
            margin-top: 15px;
        }

        .document-item {
            padding: 10px;
            margin-top: 8px;
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            cursor: pointer;
            word-break: break-word;
        }

        .document-item:hover {
            background: #e5e7eb;
        }

        .document-item.selected {
            background: #dbeafe;
            border: 2px solid #2563eb;
        }

        .document-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .selected-document {
            margin-top: 12px;
            padding: 10px;
            background: #ecfdf5;
            border: 1px solid #10b981;
            border-radius: 7px;
            color: #065f46;
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

    </style>

</head>


<body>


    <div class="header">

        <h1>🤖 The Fix</h1>

        <div
            id="accountArea"
            class="header-right hidden"
        >

            <span
                id="usernameDisplay"
                class="username-display"
            ></span>

            <button
                class="logout-button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <!-- LOGIN / REGISTER -->

    <div
        id="authSection"
        class="container"
    >

        <div class="auth-card">

            <div class="tabs">

                <button
                    id="loginTab"
                    class="tab active"
                    onclick="showLogin()"
                >
                    Login
                </button>

                <button
                    id="registerTab"
                    class="tab"
                    onclick="showRegister()"
                >
                    Register
                </button>

            </div>


            <!-- LOGIN -->

            <div id="loginForm">

                <h2>Welcome to The Fix</h2>

                <p>Login to your account</p>

                <div class="form-group">

                    <label>Username</label>

                    <input
                        id="loginUsername"
                        type="text"
                        placeholder="Enter username"
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Enter password"
                    >

                </div>


                <button
                    class="primary-button"
                    onclick="login()"
                >
                    Login
                </button>

            </div>


            <!-- REGISTER -->

            <div
                id="registerForm"
                class="hidden"
            >

                <h2>Create Account</h2>

                <p>Create your The Fix account</p>

                <div class="form-group">

                    <label>Username</label>

                    <input
                        id="registerUsername"
                        type="text"
                        placeholder="Choose a username"
                    >

                </div>


                <div class="form-group">

                    <label>Email</label>

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="Enter email"
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Create password"
                    >

                </div>


                <button
                    class="primary-button"
                    onclick="register()"
                >
                    Create Account
                </button>

            </div>


            <div
                id="authMessage"
                class="message"
            ></div>

        </div>

    </div>


    <!-- CHAT -->

    <div
        id="chatSection"
        class="container hidden"
    >

        <div class="chat-card">


            <div id="chat">

                <div class="chat-message ai-message">

                    Hello! I am The Fix.
                    How can I help you?

                </div>

            </div>


            <!-- CHAT INPUT -->

            <div class="input-area">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message The Fix..."
                    onkeydown="handleEnter(event)"
                >

                <button
                    class="send-button"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>


            <!-- DOCUMENT AREA -->

            <div class="upload-area">

                <div class="document-title">
                    📄 Documents
                </div>

                <input
                    id="pdfFile"
                    type="file"
                    accept=".pdf,.docx,.pptx,.xlsx,.txt"
                >

                <button
                    class="send-button"
                    onclick="uploadPDF()"
                >
                    Upload
                </button>


                <div
                    id="uploadStatus"
                ></div>


                <div
                    id="selectedDocument"
                    class="selected-document hidden"
                ></div>


                <div id="documentList"></div>

            </div>


        </div>

    </div>


    <script>


        const API_URL =
            "http://127.0.0.1:8000";


        let currentUser =
            JSON.parse(
                localStorage.getItem(
                    "the_fix_user"
                )
            );


        let selectedDocument = null;


        /*
        ==========================================================
        AUTH MESSAGE
        ==========================================================
        */

        function showMessage(
            message,
            type
        ) {

            const element =
                document.getElementById(
                    "authMessage"
                );

            element.textContent =
                message;

            element.className =
                "message " + type;

        }


        /*
        ==========================================================
        SHOW LOGIN
        ==========================================================
        */

        function showLogin() {

            document
                .getElementById(
                    "loginForm"
                )
                .classList
                .remove("hidden");

            document
                .getElementById(
                    "registerForm"
                )
                .classList
                .add("hidden");

            document
                .getElementById(
                    "loginTab"
                )
                .classList
                .add("active");

            document
                .getElementById(
                    "registerTab"
                )
                .classList
                .remove("active");

            document
                .getElementById(
                    "authMessage"
                )
                .className =
                "message";

        }


        /*
        ==========================================================
        SHOW REGISTER
        ==========================================================
        */

        function showRegister() {

            document
                .getElementById(
                    "loginForm"
                )
                .classList
                .add("hidden");

            document
                .getElementById(
                    "registerForm"
                )
                .classList
                .remove("hidden");

            document
                .getElementById(
                    "loginTab"
                )
                .classList
                .remove("active");

            document
                .getElementById(
                    "registerTab"
                )
                .classList
                .add("active");

            document
                .getElementById(
                    "authMessage"
                )
                .className =
                "message";

        }


        /*
        ==========================================================
        REGISTER
        ==========================================================
        */

        async function register() {

            const username =
                document
                    .getElementById(
                        "registerUsername"
                    )
                    .value
                    .trim();

            const email =
                document
                    .getElementById(
                        "registerEmail"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "registerPassword"
                    )
                    .value;


            if (
                !username ||
                !email ||
                !password
            ) {

                showMessage(
                    "Please complete all fields.",
                    "error"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/register",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    email,
                                    password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    data.success !== true
                ) {

                    showMessage(
                        data.error ||
                        data.detail ||
                        "Registration failed.",
                        "error"
                    );

                    return;

                }


                showMessage(
                    "Account created successfully. You can now log in.",
                    "success"
                );


                document
                    .getElementById(
                        "loginUsername"
                    )
                    .value =
                    username;


                document
                    .getElementById(
                        "loginPassword"
                    )
                    .value =
                    "";


                showLogin();

            }


            catch (error) {

                console.error(
                    "Registration error:",
                    error
                );

                showMessage(
                    "Could not connect to The Fix.",
                    "error"
                );

            }

        }


        /*
        ==========================================================
        LOGIN
        ==========================================================
        */

        async function login() {

            const username =
                document
                    .getElementById(
                        "loginUsername"
                    )
                    .value
                    .trim();

            const password =
                document
                    .getElementById(
                        "loginPassword"
                    )
                    .value;


            if (
                !username ||
                !password
            ) {

                showMessage(
                    "Enter your username and password.",
                    "error"
                );

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    username,
                                    password
                                })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    data.success !== true
                ) {

                    showMessage(
                        data.error ||
                        data.detail ||
                        "Login failed.",
                        "error"
                    );

                    return;

                }


                currentUser =
                    data.user;


                localStorage.setItem(
                    "the_fix_user",
                    JSON.stringify(
                        currentUser
                    )
                );


                showChat();

            }


            catch (error) {

                console.error(
                    "Login error:",
                    error
                );

                showMessage(
                    "Could not connect to The Fix.",
                    "error"
                );

            }

        }


        /*
        ==========================================================
        SHOW CHAT
        ==========================================================
        */

        function showChat() {

            document
                .getElementById(
                    "authSection"
                )
                .classList
                .add("hidden");


            document
                .getElementById(
                    "chatSection"
                )
                .classList
                .remove("hidden");


            document
                .getElementById(
                    "accountArea"
                )
                .classList
                .remove("hidden");


            document
                .getElementById(
                    "usernameDisplay"
                )
                .textContent =
                "Logged in as " +
                currentUser.username;


            loadDocuments();

        }


        /*
        ==========================================================
        LOGOUT
        ==========================================================
        */

        function logout() {

            currentUser =
                null;

            selectedDocument =
                null;

            localStorage.removeItem(
                "the_fix_user"
            );

            location.reload();

        }


        /*
        ==========================================================
        ENTER KEY
        ==========================================================
        */

        function handleEnter(event) {

            if (
                event.key ===
                "Enter"
            ) {

                sendMessage();

            }

        }


        /*
        ==========================================================
        ADD CHAT MESSAGE
        ==========================================================
        */

        function addMessage(
            text,
            type
        ) {

            const chat =
                document.getElementById(
                    "chat"
                );


            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "chat-message " +
                type;


            message.textContent =
                text;


            chat.appendChild(
                message
            );


            chat.scrollTop =
                chat.scrollHeight;


            return message;

        }


        /*
        ==========================================================
        SEND MESSAGE
        ==========================================================
        */

        async function sendMessage() {

            if (!currentUser) {

                return;

            }


            const input =
                document.getElementById(
                    "messageInput"
                );


            const message =
                input.value.trim();


            if (!message) {

                return;

            }


            addMessage(
                message,
                "user-message"
            );


            input.value = "";


            const thinkingMessage =
                addMessage(
                    "The Fix is thinking...",
                    "ai-message"
                );


            try {

                let response;


                /*
                If a document is selected,
                ask the document-question endpoint.
                */

                if (selectedDocument) {

                    response =
                        await fetch(
                            API_URL +
                            "/pdf-question",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        question:
                                            message,

                                        user_id:
                                            currentUser.user_id,

                                        filename:
                                            selectedDocument
                                    })
                            }
                        );

                }


                /*
                Otherwise use normal chat.
                */

                else {

                    response =
                        await fetch(
                            API_URL +
                            "/chat",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        message,

                                        user_id:
                                            currentUser.user_id
                                    })
                            }
                        );

                }


                const data =
                    await response.json();


                if (
                    data.answer
                ) {

                    thinkingMessage.textContent =
                        data.answer;

                }


                else if (
                    data.error
                ) {

                    thinkingMessage.textContent =
                        "Error: " +
                        data.error;

                }


                else if (
                    data.detail
                ) {

                    thinkingMessage.textContent =
                        "Error: " +
                        data.detail;

                }


                else {

                    thinkingMessage.textContent =
                        "The Fix could not process that request.";

                }

            }


            catch (error) {

                console.error(
                    "Chat error:",
                    error
                );

                thinkingMessage.textContent =
                    "Could not connect to The Fix.";

            }

        }


        /*
        ==========================================================
        UPLOAD DOCUMENT
        ==========================================================
        */

        async function uploadPDF() {

            if (!currentUser) {

                return;

            }


            const fileInput =
                document.getElementById(
                    "pdfFile"
                );


            const status =
                document.getElementById(
                    "uploadStatus"
                );


            if (
                !fileInput.files.length
            ) {

                status.textContent =
                    "Please select a document.";

                return;

            }


            const file =
                fileInput.files[0];


            const allowedTypes = [
                ".pdf",
                ".docx",
                ".pptx",
                ".xlsx",
                ".txt"
            ];


            const fileName =
                file.name.toLowerCase();


            const supported =
                allowedTypes.some(
                    extension =>
                        fileName.endsWith(
                            extension
                        )
                );


            if (!supported) {

                status.textContent =
                    "Supported files: PDF, DOCX, PPTX, XLSX and TXT.";

                return;

            }


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            status.textContent =
                "Uploading and reading document...";


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/upload-pdf",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const data =
                    await response.json();


                if (
                    response.ok &&
                    data.success === true
                ) {

                    selectedDocument =
                        data.stored_filename;


                    status.textContent =
                        "Document uploaded successfully. " +
                        data.characters +
                        " characters extracted.";


                    updateSelectedDocument();


                    await loadDocuments();


                    fileInput.value = "";

                }


                else {

                    status.textContent =
                        data.detail ||
                        data.error ||
                        "Document upload failed.";

                }

            }


            catch (error) {

                console.error(
                    "Document upload error:",
                    error
                );

                status.textContent =
                    "Could not connect to The Fix.";

            }

        }


        /*
        ==========================================================
        LOAD DOCUMENTS
        ==========================================================
        */

        async function loadDocuments() {

            if (!currentUser) {

                return;

            }


            const documentList =
                document.getElementById(
                    "documentList"
                );


            if (!documentList) {

                return;

            }


            try {

                const response =
                    await fetch(
                        API_URL +
                        "/documents"
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    data.success !== true
                ) {

                    return;

                }


                documentList.innerHTML =
                    "";


                if (
                    !data.documents ||
                    data.documents.length === 0
                ) {

                    documentList.innerHTML =
                        "<p>No documents uploaded yet.</p>";

                    return;

                }


                data.documents.forEach(
                    documentData => {

                        const item =
                            document.createElement(
                                "div"
                            );


                        item.className =
                            "document-item";


                        if (
                            selectedDocument ===
                            documentData.filename
                        ) {

                            item.classList.add(
                                "selected"
                            );

                        }


                        item.textContent =
                            documentData.filename;


                        item.onclick =
                            function () {

                                selectedDocument =
                                    documentData.filename;


                                documentList
                                    .querySelectorAll(
                                        ".document-item"
                                    )
                                    .forEach(
                                        element => {

                                            element.classList.remove(
                                                "selected"
                                            );

                                        }
                                    );


                                item.classList.add(
                                    "selected"
                                );


                                updateSelectedDocument();

                            };


                        documentList.appendChild(
                            item
                        );

                    }
                );


                updateSelectedDocument();

            }


            catch (error) {

                console.error(
                    "Document list error:",
                    error
                );

            }

        }


        /*
        ==========================================================
        SHOW SELECTED DOCUMENT
        ==========================================================
        */

        function updateSelectedDocument() {

            const element =
                document.getElementById(
                    "selectedDocument"
                );


            if (!element) {

                return;

            }


            if (selectedDocument) {

                element.textContent =
                    "📄 Selected document: " +
                    selectedDocument +
                    " — your questions will be answered from this document.";

                element.classList.remove(
                    "hidden"
                );

            }


            else {

                element.textContent =
                    "";

                element.classList.add(
                    "hidden"
                );

            }

        }


        /*
        ==========================================================
        PAGE LOAD
        ==========================================================
        */

        window.onload =
            function () {

                if (currentUser) {

                    showChat();

                }

            };


    </script>

</body>

</html>
